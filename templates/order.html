<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Place Order — QuickDeliver</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <nav class="navbar">
        <a href="/" class="nav-brand">🛵 QuickDeliver</a>
    </nav>

    <section class="form-section">
        <div class="form-card">
            <h2>Place Your Order</h2>

            <!-- Item Summary -->
            <div class="order-summary">
                <span class="summary-emoji">🍽️</span>
                <div>
                    <h3>{{ item['name'] }}</h3>
                    <p>{{ item['description'] }}</p>
                    <p class="price">₦{{ "%.2f"|format(item['price']) }} per item</p>
                </div>
            </div>

            <!-- Order Form -->
            <form action="/place-order" method="POST">
                <input type="hidden" name="item_id" value="{{ item['id'] }}">

                <div class="form-group">
                    <label>Your Full Name</label>
                    <input type="text" name="customer_name" placeholder="e.g. John Doe" required>
                </div>

                <div class="form-group">
                    <label>Delivery Address</label>
                    <input type="text" name="customer_address" placeholder="e.g. 12 Broad Street, Lagos" required>
                </div>

                <div class="form-group">
                    <label>Phone Number</label>
                    <input type="tel" name="customer_phone" placeholder="e.g. 08012345678" required>
                </div>

                <div class="form-group">
                    <label>Quantity</label>
                    <input type="number" name="quantity" value="1" min="1" max="10" required>
                </div>

                <button type="submit" class="btn-submit">Confirm Order 🛵</button>
            </form>
        </div>
    </section>

    <footer>
        <p>© 2026 QuickDeliver. All rights reserved.</p>
    </footer>

    <script src="{{ url_for('static', filename='main.js') }}"></script>
</body>
</html>
